  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
{{root-redirect}}
  <meta name="theme-color" content="#0e3a3c">
  <!-- Site icons (one artwork, assets/img/favicon.svg): favicon.ico lives at the site root, where crawlers and
       browsers also ask for it without a link (the "root" marker is the path back to the root from this page);
       then the SVG, a 192 px PNG (Android, search results) and the apple-touch-icon (180 px, square corners:
       iOS rounds them itself). -->
  <link rel="icon" href="{{root}}favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <!--
    Runs before first paint: flags JS support. Each language has its own static page, so nothing is
    translated here. The timeout guarantees the hero content shows even if the scripts fail to load.
  -->
  <script>
    (function (root) {
      root.classList.add('js');
      setTimeout(function () { root.classList.add('hero-ready'); }, 3000);
    })(document.documentElement);
  </script>

  <!-- Inter Tight is self-hosted (@font-face in styles.css). Its latin file is on every page: preloaded with the
       exact URL the stylesheet resolves to (crossorigin, as font requests are), so it downloads alongside the CSS. -->
  <link rel="preload" href="assets/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
